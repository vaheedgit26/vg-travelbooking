apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configmap.name }}
  namespace: {{ .Values.namespace }}
data:
  NODE_ENV: production
  PORT: "3001"
  DB_HOST: {{ .Values.postgre.externalNameService | quote }}
  DB_PORT: {{ .Values.postgre.port | quote }}
  DB_NAME: {{ .Values.postgre.database | quote }}
  # DB_SSLMODE: disable
