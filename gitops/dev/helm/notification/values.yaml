# ──────────────────────────────────────
# Notification
# ──────────────────────────────────────
namespace: travelbooking-dev

image:
    uri: 254405569649.dkr.ecr.us-east-1.amazonaws.com
    name: travelbooking/notification
    version: v2

deployment:
    name: notification-deploy
    replicas: 1

service:
    name: notification-svc
    port: 3005
    targetPort: 3005

hpa:
    name: notification-hpa
    minReplicas: 1
    maxReplicas: 3

configmap:
    name: notification-config

secret:
    name: travelbooking-dev-postgre-jwt-creds

# ──────────────────────────────────────
# Postgre DB
# ──────────────────────────────────────
postgre:
  host: travelbooking-dev-postgre.ca9aykaigakf.us-east-1.rds.amazonaws.com
  port: 5432
  externalNameService: travelbooking-postgre-ens
  database: notificationdb
  user: postgre
  sslmode: disable
    
jwtSecret: ""

# ──────────────────────────────────────
# Redis
# ──────────────────────────────────────
redis:
  host: redis-svc
  port: 6379
