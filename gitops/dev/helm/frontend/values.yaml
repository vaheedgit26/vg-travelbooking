# ──────────────────────────────────────
# Frontend
# ──────────────────────────────────────
namespace: travelbooking-dev

image:
    uri: 254405569649.dkr.ecr.us-east-1.amazonaws.com
    name: travelbooking/frontend
    version: v1

deployment:
    name: frontend-deploy
    replicas: 1

service:
    name: frontend-svc
    port: 8080
    targetPort: 8080

hpa:
    name: frontend-hpa
    minReplicas: 1
    maxReplicas: 3

# ──────────────────────────────────────
# Postgre DB
# ──────────────────────────────────────
postgre:
  host: shopverse-dev-mysql.ca9aykaigakf.us-east-1.rds.amazonaws.com
  port: 5432
  externalNameService: travelbooking-postgre-ens
  database: bookingdb
  user: shopverse
  sslmode: disable
    
jwtSecret: ""
