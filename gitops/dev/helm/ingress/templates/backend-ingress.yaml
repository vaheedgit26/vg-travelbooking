{{- if .Values.backendIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.backendIngress.name }}                             # shopverse-backend-ingress
  {{- with .Values.backendIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.backendIngress.ingressClassName }}     # alb
  rules:
    - http:
        paths:
          - path: /api/users                  
            pathType: {{ .Values.backend.ingress.pathType }}           # Prefix
            backend:
              service:
                name: user-svc
                port:
                  number: 3001  

          - path: /api/search                  
            pathType: {{ .Values.backend.ingress.pathType }}           # Prefix
            backend:
              service:
                name: search-svc
                port:
                  number: 3002

          - path: /api/bookings                 
            pathType: {{ .Values.backend.ingress.pathType }}           # Prefix
            backend:
              service:
                name: booking-svc
                port:
                  number: 3003 

          - path: /api/payments                 
            pathType: {{ .Values.backend.ingress.pathType }}           # Prefix
            backend:
              service:
                name: payment-svc
                port:
                  number: 3004  

          - path: /api/notifications                 
            pathType: {{ .Values.backend.ingress.pathType }}           # Prefix
            backend:
              service:
                name: notification-svc
                port:
                  number: 3005  

          
{{- end }}
