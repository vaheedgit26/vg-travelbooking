{{- if .Values.baseIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.baseIngress.name }}                            # shopverse-base-ingress
  {{- with .Values.baseIngress.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.baseIngress.ingressClassName }}    # alb

  # ⚠️ Dummy rule (required to create ALB)
  rules:
    - http:
        paths:
          - path: /dummy
            pathType: Prefix
            backend:
              service:
                name: dummy-service
                port:
                  number: 80
{{- end }}
