# ──────────────────────────────────────
# Search
# ──────────────────────────────────────
namespace: travelbooking-dev

image:
    uri: 254405569649.dkr.ecr.us-east-1.amazonaws.com
    name: travelbooking/search
    version: v2

deployment:
    name: search-deploy
    replicas: 1

service:
    name: search-svc
    port: 3002
    targetPort: 3002

hpa:
    name: search-hpa
    minReplicas: 1
    maxReplicas: 3

configmap:
    name: search-config

secret:
    name: travelbooking-dev-postgre-jwt-creds

# ──────────────────────────────────────
# Postgre DB
# ──────────────────────────────────────
postgre:
  host: shopverse-dev-mysql.ca9aykaigakf.us-east-1.rds.amazonaws.com
  port: 5432
  externalNameService: travelbooking-postgre-ens
  database: searchdb
  user: postgre
  sslmode: disable
    
jwtSecret: ""

# ──────────────────────────────────────
# Redis
# ──────────────────────────────────────
redis:
  host: redis-svc
  port: 6379
