apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.booking.service.name }}
  namespace: {{ .Values.booking.namespace.name }}
  labels:
    app: booking-service
spec:
  type: ClusterIP
  selector:
    app: booking-service
  ports:
  - name: http
    port: {{ .Values.booking.service.port }}             # 3003
    targetPort: {{ .Values.booking.service.targetPort }} # 3003
